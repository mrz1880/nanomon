# Workflow actions are pinned to commit SHAs, which never move on their own:
# Dependabot proposes the bumps, and the `# vX.Y.Z` comments follow.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The builder tracks the MSRV (Cargo.toml rust-version), not the latest.
      - dependency-name: rust
