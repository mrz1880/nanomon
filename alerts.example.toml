# NanoMon Alert Configuration Example
# Copy this file and set NANOMON_ALERT_CONFIG=/path/to/alerts.toml
#
# A rule notifies once when the value crosses the threshold, and once more when
# it comes back. It stays silent in between, however long the incident lasts.
#
# Optional per rule:
#   severity   info | warning (default) | critical
#              Drives the notification priority, so a full disk does not arrive
#              looking like a transient load spike.
#   hysteresis Margin the value must clear before the incident is declared over.
#              Defaults to 5% of the threshold, which stops a value sitting on
#              the limit from alternating between firing and resolved.

[[rules]]
name = "High CPU"
metric = "cpu_usage"
condition = "above"
threshold = 90.0
webhook_url = "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
cooldown_seconds = 300
severity = "warning"

[[rules]]
name = "High Memory"
metric = "memory_usage"
condition = "above"
threshold = 85.0
webhook_url = "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
cooldown_seconds = 300

[[rules]]
name = "Disk Almost Full"
metric = { disk_usage = { mount_point = "/" } }
condition = "above"
threshold = 90.0
webhook_url = "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
cooldown_seconds = 600
severity = "critical"

[[rules]]
name = "High Load"
metric = "load_average1m"
condition = "above"
threshold = 8.0
webhook_url = "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
cooldown_seconds = 300

[[rules]]
# Check the level the sensor itself reports as high (/sys/class/hwmon) before
# picking a number: alerting well under the hardware limit only creates noise.
name = "CPU Overheating"
metric = { temperature = { label = "Package id 0" } }
condition = "above"
threshold = 90.0
webhook_url = "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
cooldown_seconds = 60
severity = "critical"
hysteresis = 5.0

# Alert on a metric ingested from NANOMON_SCRAPE_URLS (matched by its name).
[[rules]]
name = "Queue backlog"
metric = { external = { name = "app_queue_depth" } }
condition = "above"
threshold = 1000.0
webhook_url = "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
cooldown_seconds = 300

# Systemd service rules (require NANOMON_ENABLE_SYSTEMD=true).
# Fire when a unit *enters* one of the `alert_when` states (on transition, not
# on every cycle) and stay quiet while it remains down. A recovery followed by a
# new failure alerts again. `cooldown_seconds` suppresses rapid flapping.
[[service_rules]]
name = "nginx down"
unit = "nginx"                    # unit name without the .service suffix
alert_when = ["failed", "inactive"]
webhook_url = "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
cooldown_seconds = 300

[[service_rules]]
name = "worker failed"
unit = "myworker"
alert_when = ["failed"]
webhook_url = "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
cooldown_seconds = 300
