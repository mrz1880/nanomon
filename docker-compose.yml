# Local development only. Production lives in deploy/compose.yml.
services:
  nanomon:
    build: .
    container_name: nanomon
    ports:
      - "3000:3000"
    # The image runs unprivileged; this group grants read access to the
    # Docker socket. Docker Desktop owns it as root:root (gid 0). On a Linux
    # host, set DOCKER_GID to `stat -c %g /var/run/docker.sock`.
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      - NANOMON_PORT=3000
      - NANOMON_POLL_INTERVAL=10
      - NANOMON_HISTORY_SIZE=360
      - NANOMON_PROCESS_LIMIT=20
      - NANOMON_PROC_PATH=/host/proc
      - NANOMON_SYS_PATH=/host/sys
      - NANOMON_LOG_LEVEL=info
      # - NANOMON_ENABLE_SYSTEMD=true
      # - NANOMON_ALERT_CONFIG=/etc/nanomon/alerts.toml
    restart: unless-stopped
    # Required to read host processes
    pid: host
    # Security options
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem (except /tmp)
    read_only: true
    tmpfs:
      - /tmp
