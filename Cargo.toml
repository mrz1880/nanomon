[package]
name = "nanomon"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
authors = ["Anthony D. <mrz1880@gmail.com>"]
description = "Lightweight self-hosted server & NAS monitoring: host, Docker, processes, temperatures, alerting and Prometheus — under 15 MB RAM"
license = "MIT"
repository = "https://github.com/mrz1880/nanomon"
readme = "README.md"
keywords = ["monitoring", "server", "nas", "docker", "prometheus"]
categories = ["command-line-utilities"]

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# HTTP server
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# Docker client
bollard = "0.18"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async trait
async-trait = "0.1"

# Embed static files
# debug-embed: without it a debug build (cargo test) reads from disk instead
# of the binary. mime-guess: gates metadata().mimetype().
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }

# System calls (for statvfs)
nix = { version = "0.29", features = ["fs"] }

# Futures (for stream handling)
futures = "0.3"

# Stream adapters (BroadcastStream -> Server-Sent Events)
tokio-stream = { version = "0.1", features = ["sync"] }

# HTTP client (for webhook alerts)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Config file parsing (for alert rules)
toml = "0.8"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization
strip = true        # Strip symbols
panic = "abort"     # Smaller binary
