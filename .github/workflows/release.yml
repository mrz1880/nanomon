name: Release binaries

# Publishes stripped, statically-linked (musl) binaries plus their SHA-256 as
# release assets on every `v*` tag, so external installers can fetch-and-verify
# a pinned binary without a Rust toolchain or Docker on the target host.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - name: Install cross
        run: cargo install cross --locked

      - name: Build release binary (${{ matrix.target }})
        run: cross build --release --target ${{ matrix.target }}

      - name: Package binary + checksum
        run: |
          set -euo pipefail
          out="nanomon-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/nanomon" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "Published $out"
          cat "$out.sha256"

      - name: Attach to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            nanomon-${{ matrix.target }}
            nanomon-${{ matrix.target }}.sha256
